name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r privacy_firewall/requirements.txt

      - name: Run test suite
        working-directory: privacy_firewall
        env:
          PYTHONPATH: .
        run: python -m pytest -v --tb=short

      - name: Run end-to-end demo
        working-directory: privacy_firewall
        env:
          PYTHONPATH: .
        run: python demo.py --no-pause --no-color
